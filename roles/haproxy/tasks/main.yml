---
- name: Creer le repertoire de configuration haproxy
  ansible.builtin.file:
    path: "{{ haproxy_cfg_dir }}"
    state: directory
    mode: '0755'

- name: Generer haproxy.cfg
  ansible.builtin.template:
    src: haproxy.cfg.j2
    dest: "{{ haproxy_cfg_dir }}/haproxy.cfg"

- name: Demarrer le conteneur haproxy
  community.docker.docker_container:
    name: "{{ haproxy_container_name }}"
    image: "{{ haproxy_image }}"
    state: started
    capabilities:
      - NET_BIND_SERVICE
    networks:
      - name: "{{ docker_network_name }}"
    published_ports:
      - "443:443"
      - "8404:8404"
    volumes:
      - "{{ haproxy_cfg_dir }}/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro"
      - "{{ certs_dir }}/haproxy.pem:/etc/ssl/certs/haproxy.pem:ro"
